<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เรียกรถฉุกเฉิน - พิกัด GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 text-center">
        <div class="mb-6">
            <span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">ระบบรับแจ้งเหตุฉุกเฉิน</span>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">ขอความช่วยเหลือด่วน</h1>
            <p class="text-sm text-gray-500">กดปุ่มเพื่อส่งตำแหน่ง GPS ไปยังศูนย์สั่งการ</p>
        </div>

        <div class="space-y-4 text-left mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ติดต่อกลับ <span class="text-red-500">*</span></label>
                <input type="tel" id="phone" placeholder="08X-XXX-XXXX" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none text-lg">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อาการเบื้องต้น</label>
                <select id="symptom" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:outline-none bg-white">
                    <option value="ไม่ระบุ/อื่นๆ">-- เลือกอาการเบื้องต้น --</option>
                    <option value="หมดสติ / ไม่รู้สึกตัว">หมดสติ / ไม่รู้สึกตัว</option>
                    <option value="แน่นหน้าอก / หายใจลำบาก">แน่นหน้าอก / หายใจลำบาก</option>
                    <option value="อุบัติเหตุ / มีบาดแผลเลือดออกมาก">อุบัติเหตุ / เลือดออกมาก</option>
                    <option value="ชักเกร็ง / แขนขาอ่อนแรง">ชักเกร็ง / แขนขาอ่อนแรง</option>
                </select>
            </div>
        </div>

        <button onclick="sendEmergency()" id="btn-submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg transition duration-200 text-xl flex items-center justify-center space-x-2">
            <span>กดเรียกรถฉุกเฉินทันที</span>
        </button>

        <div id="status-box" class="mt-4 p-4 rounded-xl text-sm hidden"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyClydi2GyQ6WYYHyksZbs7cxy1ci38YaZc",
            authDomain: "hospital--ems.firebaseapp.com",
            databaseURL: "https://hospital--ems-default-rtdb.firebaseio.com",
            projectId: "hospital--ems",
            storageBucket: "hospital--ems.firebasestorage.app",
            messagingSenderId: "253605524625",
            appId: "1:253605524625:web:486173df5450b436da7b30"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendEmergency() {
            const phone = document.getElementById('phone').value;
            const symptom = document.getElementById('symptom').value;
            const statusBox = document.getElementById('status-box');
            const btn = document.getElementById('btn-submit');

            if (!phone) {
                alert('กรุณากรอกเบอร์โทรศัพท์ด้วยครับ');
                return;
            }

            btn.disabled = true;
            btn.innerText = "กำลังดึงพิกัด GPS...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const timeString = new Date().toLocaleString('th-TH');

                        const newCaseRef = database.ref('cases').push();
                        newCaseRef.set({
                            phone: phone,
                            symptom: symptom,
                            lat: lat,
                            lng: lng,
                            timestamp: timeString,
                            status: 'pending'
                        }).then(() => {
                            statusBox.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                            statusBox.classList.add('bg-green-100', 'text-green-800');
                            statusBox.innerHTML = `
                                <p class="font-bold text-base">ส่งสัญญาณขอความช่วยเหลือแล้ว!</p>
                                <p class="mt-1">เจ้าหน้าที่กำลังติดต่อกลับเบอร์: ${phone}</p>
                            `;
                            btn.innerText = "ส่งข้อมูลเรียบร้อยแล้ว";
                        }).catch((err) => {
                            alert('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message);
                            btn.disabled = false;
                            btn.innerText = "กดเรียกรถฉุกเฉินทันที";
                        });
                    },
                    (error) => {
                        btn.disabled = false;
                        btn.innerText = "กดเรียกรถฉุกเฉินทันที";
                        alert('ไม่สามารถดึงพิกัด GPS ได้ กรุณาเปิด Location Service บนมือถือ');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert('อุปกรณ์ไม่รองรับ GPS');
            }
        }
    </script>
</body>
</html>
