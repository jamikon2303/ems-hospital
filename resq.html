<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESQ LINK - ระบบเรียก & สั่งการรถฉุกเฉิน</title>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    :root {
      --bg: #0A0F1C; --surface: #111A2E; --surface2: #182541; --border: #26324B;
      --text: #EAF0FA; --text-dim: #8592AC; --red: #EF4B4F; --red-dim: #3A1620;
      --amber: #F2A93B; --amber-dim: #3A2C10; --green: #34C77B; --green-dim: #0F2D20;
      --blue: #4C8DFF; --blue-dim: #12213F;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; }
    .grid-svg line { stroke: #1C2841; stroke-width: 0.3; }
    .grid-svg .road { stroke: #2B3B5E; stroke-width: 1.4; fill: none; }
    .radar-sweep {
      position: absolute; inset: -20%; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(76,141,255,0.22), transparent 22%);
      animation: spin 5s linear infinite; pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse-ring {
      position: absolute; bottom: 0; left: 50%; width: 16px; height: 16px; margin-left: -8px; margin-bottom: -8px;
      border-radius: 50%; border: 2px solid var(--red); animation: pulse 1.8s ease-out infinite; opacity: 0.7;
    }
    .pulse-ring.delay { animation-delay: 0.9s; }
    @keyframes pulse { 0% { transform: scale(0.4); opacity: 0.8; } 100% { transform: scale(3.2); opacity: 0; } }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--blue);
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const SPEED_FACTOR = 22;
    const CASE_TYPES = [
      { id: "unconscious", label: "หมดสติ / ไม่รู้สึกตัว", icon: "alert-triangle", priority: "แดง" },
      { id: "cardiac", label: "เจ็บหน้าอก / หัวใจ", icon: "heart-pulse", priority: "แดง" },
      { id: "accident", label: "อุบัติเหตุจราจร", icon: "car", priority: "แดง" },
      { id: "breathing", label: "หายใจลำบาก", icon: "wind", priority: "เหลือง" },
      { id: "labor", label: "คลอดฉุกเฉิน", icon: "baby", priority: "เหลือง" },
      { id: "other", label: "เหตุฉุกเฉินอื่นๆ", icon: "siren", priority: "เขียว" },
    ];

    const INITIAL_VEHICLES = [
      { id: "v1", name: "กู้ชีพ 1", level: "ALS", x: 22, y: 28, status: "available" },
      { id: "v2", name: "กู้ชีพ 2", level: "BLS", x: 74, y: 22, status: "available" },
      { id: "v3", name: "กู้ชีพ 3", level: "BLS", x: 46, y: 76, status: "available" },
      { id: "v4", name: "กู้ชีพ 4", level: "ALS", x: 82, y: 68, status: "available" },
    ];

    const STEPS = [
      { key: "pending", label: "แจ้งเหตุ" },
      { key: "assigned", label: "ศูนย์รับเรื่อง" },
      { key: "enroute", label: "กำลังเดินทาง" },
      { key: "arrived", label: "ถึงที่เกิดเหตุ" },
      { key: "completed", label: "เสร็จสิ้น" },
    ];

    const STATUS_META = {
      pending: { label: "รอศูนย์รับเรื่อง", cls: "bg-[#3A2C10] text-[#F2A93B]" },
      assigned: { label: "ศูนย์รับเรื่องแล้ว", cls: "bg-[#12213F] text-[#4C8DFF]" },
      enroute: { label: "กำลังเดินทาง", cls: "bg-[#12213F] text-[#4C8DFF]" },
      arrived: { label: "ถึงที่เกิดเหตุ", cls: "bg-[#0F2D20] text-[#34C77B]" },
      completed: { label: "ปิดเคสแล้ว", cls: "bg-[#182541] text-[#8592AC]" },
    };

    function fmtClock(secs) {
      const s = Math.max(0, Math.round(secs));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function App() {
      const [role, setRole] = useState("caller");
      const [vehicles, setVehicles] = useState(INITIAL_VEHICLES);
      const [cases, setCases] = useState([]);
      const seqRef = useRef(1);
      const timersRef = useRef({});

      useEffect(() => {
        lucide.createIcons();
      });

      const createCase = useCallback((type, pos, note) => {
        const id = `EMS-260824-${String(seqRef.current).padStart(3, "0")}`;
        seqRef.current += 1;
        const etaSeconds = 180 + Math.round(Math.random() * 240);
        const newCase = { id, type, pos, note, status: "pending", createdAt: Date.now(), etaSeconds, etaRemaining: etaSeconds, vehicleId: null };
        setCases((prev) => [newCase, ...prev]);
        return id;
      }, []);

      const assignVehicle = useCallback((caseId, vehicleId) => {
        setCases((prev) => prev.map((c) => (c.id === caseId ? { ...c, status: "assigned", vehicleId } : c)));
        setVehicles((prev) => prev.map((v) => (v.id === vehicleId ? { ...v, status: "busy" } : v)));

        setTimeout(() => {
          setCases((prevC) => {
            const target = prevC.find((c) => c.id === caseId);
            if (!target) return prevC;
            setVehicles((prevV) => prevV.map((v) => (v.id === vehicleId ? { ...v, x: target.pos.x, y: target.pos.y } : v)));
            return prevC.map((c) => (c.id === caseId ? { ...c, status: "enroute" } : c));
          });
        }, 900);
      }, []);

      const completeCase = useCallback((caseId) => {
        setCases((prev) => prev.map((c) => (c.id === caseId ? { ...c, status: "completed" } : c)));
        setCases((prevAfter) => {
          const c = prevAfter.find((x) => x.id === caseId);
          if (c && c.vehicleId) {
            setVehicles((prevV) => prevV.map((v) => (v.id === c.vehicleId ? { ...v, status: "available" } : v)));
          }
          return prevAfter;
        });
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-[#0A0F1C] text-[#EAF0FA]">
          <header className="flex items-center justify-between p-4 border-b border-[#26324B] bg-[#0D1424] sticky top-0 z-20">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-[#3A1620] text-[#EF4B4F] flex items-center justify-center">
                <i data-lucide="ambulance" class="w-5 h-5"></i>
              </div>
              <div>
                <div className="font-[Space_Grotesk] font-bold text-base tracking-wider">RESQ LINK</div>
                <div className="text-xs text-[#8592AC]">ระบบเรียก & สั่งการรถฉุกเฉิน</div>
              </div>
            </div>
            <div className="flex bg-[#111A2E] border border-[#26324B] rounded-xl p-1">
              <button className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${role === 'caller' ? 'bg-[#12213F] text-[#4C8DFF]' : 'text-[#8592AC]'}`} onClick={() => setRole("caller")}>ผู้แจ้งเหตุ</button>
              <button className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${role === 'dispatch' ? 'bg-[#12213F] text-[#4C8DFF]' : 'text-[#8592AC]'}`} onClick={() => setRole("dispatch")}>ศูนย์สั่งการ</button>
            </div>
          </header>

          {role === "caller" ? (
            <main className="flex-1 p-4 max-w-lg mx-auto w-full flex flex-col gap-4">
              <section className="bg-[#111A2E] border border-[#26324B] rounded-2xl p-4">
                <div className="text-xs text-[#8592AC] flex items-center gap-1.5 mb-2">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ตำแหน่งเหตุฉุกเฉิน — แตะบนแผนที่เพื่อปักหมุด
                </div>
                <div className="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-[#0C1428] border border-[#26324B]" onClick={(e) => {
                  const rect = e.currentTarget.getBoundingClientRect();
                  const x = ((e.clientX - rect.left) / rect.width) * 100;
                  const y = ((e.clientY - rect.top) / rect.height) * 100;
                  alert(`ปักหมุดตำแหน่งพิกัด X: ${x.toFixed(0)}%, Y: ${y.toFixed(0)}% เรียบร้อยแล้ว`);
                }}>
                  <svg className="grid-svg absolute inset-0 w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <line x1="20" y1="0" x2="20" y2="100" /><line x1="50" y1="0" x2="50" y2="100" /><line x1="80" y1="0" x2="80" y2="100" />
                    <line x1="0" y1="30" x2="100" y2="30" /><line x1="0" y1="70" x2="100" y2="70" />
                    <path d="M0,65 C 25,55 40,75 100,40" className="road" />
                  </svg>
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-full text-[#EF4B4F]">
                    <span className="pulse-ring"></span>
                    <i data-lucide="map-pin" class="w-7 h-7"></i>
                  </div>
                </div>
              </section>

              <section className="bg-[#111A2E] border border-[#26324B] rounded-2xl p-4">
                <div className="text-xs font-semibold text-[#8592AC] uppercase tracking-wider mb-3">เลือกประเภทเหตุฉุกเฉิน</div>
                <div className="grid grid-cols-2 gap-2 mb-3">
                  {CASE_TYPES.map((t) => (
                    <button key={t.id} className="flex flex-col items-start gap-1 bg-[#182541] border border-[#26324B] hover:border-[#EF4B4F] rounded-xl p-2.5 text-left text-xs font-medium" onClick={() => createCase(t.id, {x:50,y:50}, "")}>
                      <i data-lucide={t.icon} class="w-5 h-5 text-[#EF4B4F]"></i>
                      <span>{t.label}</span>
                    </button>
                  ))}
                </div>
              </section>
            </main>
          ) : (
            <main className="flex-1 p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-[#111A2E] border border-[#26324B] rounded-2xl p-4">
                <div className="text-xs font-semibold text-[#8592AC] uppercase tracking-wider mb-3">คิวเคสฉุกเฉิน</div>
                {cases.length === 0 ? <div className="text-xs text-[#8592AC] text-center py-8">ยังไม่มีเคสเข้ามา</div> : (
                  cases.map(c => (
                    <div key={c.id} className="bg-[#182541] border border-[#26324B] rounded-xl p-3 mb-2 flex items-center justify-between">
                      <div>
                        <div className="font-mono text-xs text-[#8592AC]">{c.id}</div>
                        <div className="text-sm font-semibold">{c.type}</div>
                      </div>
                      <button className="bg-[#12213F] text-[#4C8DFF] text-xs px-3 py-1.5 rounded-lg" onClick={() => assignVehicle(c.id, "v1")}>สั่งการกู้ชีพ 1</button>
                    </div>
                  ))
                )}
              </div>
              <div className="md:col-span-2 bg-[#111A2E] border border-[#26324B] rounded-2xl p-4">
                <div className="text-xs font-semibold text-[#8592AC] uppercase tracking-wider mb-3">แผนที่มอนิเตอร์สถานะ</div>
                <div className="relative w-full h-80 rounded-xl overflow-hidden bg-[#0C1428]">
                  <div className="radar-sweep"></div>
                  <div className="absolute top-1/4 left-1/4 bg-[#34C77B] text-black text-xs px-2 py-1 rounded font-bold">กู้ชีพ 1 (ว่าง)</div>
                  <div className="absolute top-2/3 left-2/3 bg-[#34C77B] text-black text-xs px-2 py-1 rounded font-bold">กู้ชีพ 2 (ว่าง)</div>
                </div>
              </div>
            </main>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
